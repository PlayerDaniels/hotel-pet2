<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet</title>
    <link rel="stylesheet" href="painel.css">
    <link rel="stylesheet" href="pet.css">
</head>

<body>

    <div class="principal">

        <div class="menu-cima">
            <div class="usuario">
                <img src="img/Daniel.jpg" alt="Foto do usuário">
                <a>Daniel Correia</a>
            </div>
        </div>

        <div class="menu-lateral">
            <div class="logo">
                <img src="img/logo-hotel-pet.webp" alt="Logo">
            </div>
            <div class="menu-opcoes">
                <a href="pet.html">Pet</a>
                <a href="usuarios.html">Usuários</a>
                <a href="configuracoes.html">Configurações</a>
                <a href="reservas.html">Reservas</a>
            </div>
        </div>

        <div class="conteudo">

            <h3>Home / Pet</h3>

            <div class="conteudo-usuario">
                <div class="botoes-usuario">
                    <a href="novo-pet.html"> + Novo Pet</a>
                </div>
            </div>

            <div class="dialogo">

                <div class="campos-esquerda">
                    <input type="text" id="busca-id" placeholder="ID">
                    <input type="text" id="busca-nome" placeholder="Nome">
                </div>

                <div class="campos-direita">
                    <input type="text" id="busca-raca" placeholder="Raça">
                    <input type="text" id="busca-tamanho" placeholder="Tamanho">
                </div>

                <div class="botoes-dialogo">
                    <button class="pesquisar" id="btn-pesquisar">Pesquisar</button>
                    <button class="limpar" id="btn-limpar">Limpar</button>
                </div>

            </div>

            <div class="cadastrados">

                <div class="barra-cadastrados">
                    <div class="espaco-check"></div>
                    <div>ID</div>
                    <div>Nome</div>
                    <div>Tipo</div>
                    <div>Raça</div>
                    <div>Tamanho</div>
                </div>

                <div class="usuario-cadastrado">
                    <div class="check"><input type="checkbox"></div>
                    <div class="ID">11122233</div>
                    <div class="pet">Zigg</div>
                    <div class="nome">Cachorro</div>
                    <div class="funcao">Golden Retriever</div>
                    <div class="criado">Grande</div>
                    <div class="acoes">
                        <a href="editar-pet.html">Editar</a>
                        <a href="ver-pet.html">Visualizar</a>
                    </div>
                </div>

                <div class="usuario-cadastrado">
                    <div class="check"><input type="checkbox"></div>
                    <div class="ID">11122234</div>
                    <div class="pet">Russo</div>
                    <div class="nome">Cachorro</div>
                    <div class="funcao">Poodle</div>
                    <div class="criado">Pequeno</div>
                    <div class="acoes">
                        <a href="editar-pet.html">Editar</a>
                        <a href="ver-pet.html">Visualizar</a>
                    </div>
                </div>

                <div class="usuario-cadastrado">
                    <div class="check"><input type="checkbox"></div>
                    <div class="ID">11122235</div>
                    <div class="pet">Luck</div>
                    <div class="nome">Gato</div>
                    <div class="funcao">Não definida</div>
                    <div class="criado">Pequeno</div>
                    <div class="acoes">
                        <a href="editar-pet.html">Editar</a>
                        <a href="ver-pet.html">Visualizar</a>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script src="js/navegacao.js"></script>
    <script src="js/pet.js"></script>
</body>

</html>
