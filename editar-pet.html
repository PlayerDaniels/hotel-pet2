<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pet</title>
    <link rel="stylesheet" href="painel.css">
    <link rel="stylesheet" href="editar-pet.css">
</head>

<body>




    <div class="principal">


        <div class="menu-cima">

            <div class="usuario">
                <img src="img/Daniel.jpg" alt="Foto do usuário">
                <a>Daniel Correia</a>
            </div>

        </div>


        <div class="menu-lateral">

            <div class="logo">
                <img src="img/logo-hotel-pet.webp" alt="Logo">
            </div>

            <div class="menu-opcoes">

                <a href="pet.html">Pet</a>

                <a href="usuarios.html">Usuários</a>

                <a href="configuracoes.html">Configurações</a>

                <a href="reservas.html">Reservas</a>

            </div>

        </div>


        <div class="conteudo">

            <h3>Pet / editar-pet</h3>


            <div class="config-pet">

                <div class="novo-pet">

                    <h3>Editar Pet</h3>

                    <input type="text" placeholder="Proprietário">

                    <input type="text" placeholder="Nome">

                    <input type="text" placeholder="Tipo">

                    <input type="text" placeholder="Raça">

                    <input type="text" placeholder="Tamanho">

                    <div class="foto-pet">

                        <label>Foto do Pet</label>

                        <input type="file" accept="image/*">

                    </div>

                    <div class="botoes-pet">

                        <button class="limpar">Limpar</button>

                        <button class="salvar">Salvar</button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
