<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuário</title>
    <link rel="stylesheet" href="painel.css">
    <link rel="stylesheet" href="cadastrar-usuario.css">
</head>

<body>



  <div class="principal">

        <div class="menu-cima">

            <div class="usuario">
                <img src="img/Daniel.jpg" alt="Foto do usuário">
                <a>Daniel Correia</a>
            </div>

        </div>


        <div class="menu-lateral">

            <div class="logo">
                <img src="img/logo-hotel-pet.webp" alt="Logo">
            </div>

            <div class="menu-opcoes">

                <a href="pet.html">Pet</a>

                <a href="usuarios.html">Usuários</a>

                <a href="configuracoes.html">Configurações</a>

                <a href="reservas.html">Reservas</a>

            </div>

        </div>


        <div class="conteudo">

            <h3>usuarios / cadastrar-usuario</h3>

            <div class="confg-perfil">

                <div class="editar-perfil">

                    <h3>Editar Perfil</h3>

                    <input type="text" id="email" placeholder="Email">

                    <input type="text" id="nome" placeholder="Nome">

                    <input type="text" id="sobrenome" placeholder="Sobrenome">

                    <input type="text" id="telefone" placeholder="Telefone">

                    <select id="tipo">
                        <option value="cliente">Cliente</option>
                        <option value="funcionario">Funcionário</option>
                        <option value="gerente">Gerente</option>
                    </select>

                    <div class="foto-perfil">

                        <label>Foto do Perfil</label>

                        <input type="file" id="foto" accept="image/*">

                    </div>

                    <div class="botoes-perfil">

                        <button class="limpar" id="btn-limpar">Limpar</button>

                        <button class="salvar" id="btn-salvar">Salvar</button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="js/cadastrar-usuario.js"></script>
</body>

</html>
