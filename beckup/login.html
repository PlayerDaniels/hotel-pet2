<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">

</head>

<body>


    <div class="principal">

        <div class="imagem">
            <img src="img/img-Hotel-pet.webp" alt="Imagem de login">
        </div>

        <div class="login">

            <img class="logo" src="img/logo-hotel-pet.webp" alt="Logo">

            <input class="caixa-dialogo" type="text" placeholder="Usuário">

            <input class="caixa-dialogo" type="password" placeholder="Senha">

            <div class="opcoes">

                <label>
                    <input class="botao-check" type="checkbox">
                    Lembrar-me
                </label>

                <a href="esqueci-senha.html">Esqueci minha senha</a>

            </div>

            <a class="botao" href="pagina.html">Entrar</a>

            <div class="redes-sociais">

                <a href="https://www.facebook.com" target="_blank">
                    <img src="img/facebook-logo.webp" alt="Facebook">
                </a>

                <a href="https://www.instagram.com" target="_blank">
                    <img src="img/instagram-logo.webp" alt="Instagram">
                </a>

                <a href="https://www.youtube.com" target="_blank">
                    <img src="img/youtube-logo.webp" alt="YouTube">
                </a>

            </div>

            <p class="criar-conta">
                Ainda não possui uma conta?
                <a href="criar-conta.html">Criar uma conta</a>
            </p>

        </div>

    </div>

</body>

</html>
